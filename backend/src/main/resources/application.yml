# 所有外部化配置均支持环境变量注入(默认值适用于本地开发)
# 生产/服务器部署通过环境变量覆盖:DB_URL / DB_USERNAME / DB_PASSWORD /
# MONGODB_URI / FORUM_JWT_SECRET / FORUM_JWT_EXPIRE_HOURS / SERVER_PORT
server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: forum-backend

  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3307/forum_user?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&characterEncoding=utf8&allowPublicKeyRetrieval=true}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:forum123}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false

  data:
    mongodb:
      uri: ${MONGODB_URI:mongodb://localhost:27017/forum_content}

forum:
  jwt:
    # 生产环境务必通过环境变量覆盖(>=32 字节)
    secret: ${FORUM_JWT_SECRET:forum-system-dev-secret-key-0123456789abcdef0123456789}
    expire-hours: ${FORUM_JWT_EXPIRE_HOURS:24}

logging:
  level:
    com.forum: info
