# CI 流水线:git push / PR 触发
# Stage 1: 后端 Lint(Checkstyle + SpotBugs + 行数检查)
# Stage 2: 后端测试(mvn verify,含集成测试,连 CI 服务容器)
# Stage 3: Docker 端到端(docker-compose-test 起全链路 + 接口测试)
#
# 说明:Flutter Windows 构建依赖本地 SDK,不在 CI 编译;
#      本地执行 scripts/lint + flutter analyze(见 README)。
name: CI

on:
  push:
    branches: [main, develop, 'feature/**']
  pull_request:
    branches: [main, develop]

jobs:
  lint:
    name: Stage1 Backend Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Checkstyle + SpotBugs
        run: |
          cd backend
          mvn -B -q checkstyle:check
          mvn -B -q com.github.spotbugs:spotbugs-maven-plugin:check

      - name: Java 文件行数检查 (<= 800)
        run: bash scripts/check/check-line-count.sh

  test:
    name: Stage2 Backend Test
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: forum123
          MYSQL_DATABASE: forum_user
        ports:
          - 3307:3306
        options: >-
          --health-cmd "mysqladmin ping -h localhost -pforum123"
          --health-interval 10s --health-timeout 5s --health-retries 20
      mongo:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval db.runCommand({ping:1}).ok"
          --health-interval 10s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: mvn verify(集成测试)
        run: cd backend && mvn -B verify

  docker-e2e:
    name: Stage3 Docker E2E
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v4

      - name: 启动测试环境
        run: bash scripts/docker-test/start-env.sh

      - name: 端到端 API 测试
        run: bash scripts/docker-test/run-api-tests.sh

      - name: 清理测试环境
        if: always()
        run: bash scripts/docker-test/stop-env.sh
