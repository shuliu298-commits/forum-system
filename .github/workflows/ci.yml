# CI 流水线:git push / PR 触发
# Stage1: scripts/check.sh lint(Checkstyle + SpotBugs + 行数)
# Stage2: scripts/docker.sh dev up + mvn verify(集成测试)
# Stage3: scripts/check.sh e2e(Docker 全链路 + API 断言)
#
# 说明:Flutter Windows 构建依赖本地 SDK,不在 CI 编译;
#      本地执行 flutter analyze + flutter test(见 README)。
name: CI

on:
  push:
    branches: [main, develop, 'feature/**']
  pull_request:
    branches: [main, develop]

jobs:
  lint:
    name: Stage1 Backend Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Lint(Checkstyle + SpotBugs + 行数)
        run: bash scripts/check.sh lint

  test:
    name: Stage2 Backend Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: 启动数据库容器
        run: bash scripts/docker.sh dev up

      - name: mvn verify(集成测试)
        run: cd backend && mvn -B verify

      - name: 清理数据库容器
        if: always()
        run: bash scripts/docker.sh dev down

  docker-e2e:
    name: Stage3 Docker E2E
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v4

      - name: 全链路端到端测试(check.sh e2e)
        run: bash scripts/check.sh e2e
